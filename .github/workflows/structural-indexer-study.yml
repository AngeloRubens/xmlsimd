name: Structural indexer backend study

on:
  push:
    branches: [study/openjdk-xml-utf8]
    paths:
      - 'src/main/java/org/simdxml/*StructuralIndexer.java'
      - 'src/main/java/org/simdxml/StructuralIndex.java'
      - 'src/test/java/org/simdxml/RealXmlBenchmark.java'
      - 'src/test/resources/**'
      - '.github/workflows/structural-indexer-study.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/main/java/org/simdxml/*StructuralIndexer.java'
      - 'src/main/java/org/simdxml/StructuralIndex.java'
      - 'src/test/java/org/simdxml/RealXmlBenchmark.java'
      - 'src/test/resources/**'
      - '.github/workflows/structural-indexer-study.yml'
  workflow_dispatch:

concurrency:
  group: structural-indexer-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-existing-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Run correctness suite
        run: mvn -B -ntp test
      - name: Compile benchmarks and resolve classpath
        run: |
          mvn -B -ntp -DskipTests test-compile
          mvn -B -ntp dependency:build-classpath -DincludeScope=test -Dmdep.outputFile=target/benchmark-classpath.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compare existing structural indexers in CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p indexer-study-results
          result=indexer-study-results/results.txt
          java -version 2>&1 | tee "$result"
          lscpu | grep 'Model name' | tee -a "$result"
          python3 - <<'PY'
          from pathlib import Path
          cases = {
              'ascii': '<entry id="184"><name>XML scanner</name><count>12345</count></entry>',
              'mixed': '<entry id="184"><name>XML café 東京</name><count>12345</count></entry>',
              'unicode': '<entry id="184"><name>café 東京 🧪</name><count>12345</count></entry>',
          }
          target = 256 * 1024
          for kind, entry in cases.items():
              body = []
              size = len('<feed></feed>'.encode())
              while size < target:
                  body.append(entry)
                  size += len(entry.encode('utf-8'))
              Path(f'indexer-study-results/{kind}.xml').write_text(
                  '<feed>' + ''.join(body) + '</feed>', encoding='utf-8')
          PY
          printf 'generated_dataset_sha256\n' | tee -a "$result"
          sha256sum indexer-study-results/*.xml | tee -a "$result"
          cp="target/classes:target/test-classes:$(cat target/benchmark-classpath.txt)"
          flags=(-server -XX:ActiveProcessorCount=2 -Xms1500m -Xmx1500m -XX:+AlwaysPreTouch \
            -XX:+UseParallelGC -XX:+DisableExplicitGC -XX:-UsePerfData --add-modules jdk.incubator.vector)
          for dataset in indexer-study-results/ascii.xml \
                         indexer-study-results/mixed.xml \
                         indexer-study-results/unicode.xml; do
            for mode in index stream; do
              for backend in baseline scalar unsafe vector; do
                echo "dataset=$dataset mode=$mode backend=$backend" | tee -a "$result"
                java "${flags[@]}" -Dorg.simdxml.indexer="$backend" \
                  -Dorg.simdxml.tiny.threshold=0 -Dorg.simdxml.benchmark.warmups=1000 \
                  -cp "$cp" org.simdxml.RealXmlBenchmark "$dataset" 500 "$mode" | tee -a "$result"
              done
            done
          done
      - name: Publish CI summary
        if: always()
        run: cat indexer-study-results/results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-indexer-study
          path: indexer-study-results/
