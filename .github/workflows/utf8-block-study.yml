name: XML grammar SWAR study

on:
  push:
    branches: [study/openjdk-xml-utf8]
    paths:
      - 'src/test/java/org/simdxml/Xml*Scan*'
      - 'pom.xml'
      - '.github/workflows/utf8-block-study.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/test/java/org/simdxml/Xml*Scan*'
      - 'pom.xml'
      - '.github/workflows/utf8-block-study.yml'
  workflow_dispatch:

concurrency:
  group: utf8-block-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify decoder equivalence and malformed-input handling
        run: mvn -B -ntp -Dtest=Utf8BlockDecodeStudyTest,XmlStructuralScanStudyTest,XmlGrammarScanStudyTest test
      - name: Compile benchmark and resolve runtime classpath
        run: |
          mvn -B -ntp -DskipTests test-compile
          mvn -B -ntp dependency:build-classpath -DincludeScope=test -Dmdep.outputFile=target/benchmark-classpath.txt
      - name: Run forked JMH study
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p utf8-study-results
          java --add-modules jdk.incubator.vector --version 2>&1 | tee utf8-study-results/environment.txt
          nproc >> utf8-study-results/environment.txt
          lscpu | grep 'Model name' >> utf8-study-results/environment.txt
          deps="$(cat target/benchmark-classpath.txt)"
          java --add-modules jdk.incubator.vector -cp "target/classes:target/test-classes:$deps" \
            org.openjdk.jmh.Main 'org.simdxml.XmlGrammarScanBenchmark.*' \
            -f 2 -wi 3 -i 5 -w 1s -r 1s -prof gc -foe true \
            -p targetBytes=4096,65536 -p content=ascii,mixed,unicode \
            -jvmArgsAppend "--add-modules jdk.incubator.vector -XX:+UseG1GC -XX:ActiveProcessorCount=2" \
            -rf json -rff utf8-study-results/results.json > utf8-study-results/jmh.txt 2>&1
      - name: Summarize CI results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, math
          path = 'utf8-study-results/results.json'
          try:
              rows = json.load(open(path))
          except (OSError, json.JSONDecodeError):
              print('Benchmark JSON was not produced; see the uploaded logs.')
              raise SystemExit(0)
          print('## XML grammar SWAR study')
          print('\nJDK 25, JMH two forks, 3 × 1 s warmup, 5 × 1 s measurement, GC profiler. The scanner compares scalar byte classification with SWAR block candidate generation and XML context states.\n')
          print('| Content | Target chars | Method | docs/s ± error | Allocation B/op |')
          print('|---|---:|---|---:|---:|')
          for row in rows:
              p = row['params']
              score = row['primaryMetric']['score']
              error = row['primaryMetric'].get('scoreError', 0)
              size = int(p['targetBytes'])
              actual = row.get('secondaryMetrics', {})
              alloc = actual.get('gc.alloc.rate.norm') or actual.get('·gc.alloc.rate.norm') or {}
              allocation = alloc.get('score', float('nan'))
              print(f"| {p['content']} | {size:,} | {row['benchmark'].rsplit('.', 1)[-1]} | {score:,.0f} ± {error:,.0f} | {allocation:,.1f} |")
          print('\nThis is a grammar-scanner microbenchmark, not an end-to-end parser result. The prototype recognizes XML text, tags, quoted attributes, references, comments, CDATA, processing instructions, and declaration subsets. Full logs and JSON are attached as artifacts.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utf8-block-study-results
          path: utf8-study-results/
