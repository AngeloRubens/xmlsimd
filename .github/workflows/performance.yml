name: Performance benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches: [ main ]
    paths:
      - 'src/main/**'
      - 'src/test/java/org/simdxml/*Benchmark.java'
      - 'compatibility/**'
      - 'benchmarks/**'
      - 'pom.xml'
      - 'ci/**'
      - '.github/workflows/performance.yml'

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-runtime-matrix:
    name: Portable SWAR / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        java: ['8', '21', '25', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Remember compilation JDK
        run: echo "COMPILE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile portable Java 8 bytecode
        run: >-
          JAVA_HOME="$COMPILE_JAVA_HOME" mvn -B -ntp
          -f compatibility/pom.xml
          -pl :simdxml-core-java8 -am test-compile
      - name: Run portable benchmarks sequentially
        shell: bash
        run: |
          mkdir -p benchmark-results
          flags=(-server -XX:ActiveProcessorCount=2 -Xms1500m -Xmx1500m -XX:+AlwaysPreTouch -XX:+UseParallelGC -XX:+DisableExplicitGC -XX:-UsePerfData)
          cp='compatibility/java8-baseline-check/target/classes:compatibility/java8-baseline-check/target/test-classes'
          result="benchmark-results/portable-jdk-${{ matrix.java }}.txt"
          java -version 2>&1 | tee "$result"
          for validation in strict none; do
            for mode in bytes strings; do
              java "${flags[@]}" -cp "$cp" org.simdxml.compat.PortablePerformanceBenchmark "$mode" "$validation" 5000 | tee -a "$result"
            done
          done
          sh ci/render-benchmark-summary.sh "Portable SWAR benchmark / JDK ${{ matrix.java }}" "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-jdk-${{ matrix.java }}
          path: benchmark-results/*.txt

  accelerated-comparison:
    name: Vector/direct and library comparison / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    needs: portable-runtime-matrix
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Compile with JDK 24
        run: |
          mvn -B -ntp test-compile
          mvn -B -ntp dependency:build-classpath -DincludeScope=test -Dmdep.outputFile=target/benchmark-classpath.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run comparisons sequentially
        run: |
          chmod +x benchmarks/run-ci-benchmarks.sh
          JAVA_CMD="$JAVA_HOME/bin/java" RESULTS_FILE="target/benchmark-jdk-${{ matrix.java }}.txt" benchmarks/run-ci-benchmarks.sh
          sh ci/render-benchmark-summary.sh "Library comparison / JDK ${{ matrix.java }}" "target/benchmark-jdk-${{ matrix.java }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: accelerated-jdk-${{ matrix.java }}
          path: target/benchmark-jdk-${{ matrix.java }}.txt
