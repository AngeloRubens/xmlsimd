name: External XML compatibility kits

on:
  pull_request:
    paths:
      - 'compatibility/tck-adapters/**'
      - 'compatibility/**'
      - 'integrations/**'
      - 'src/**'
      - '.github/workflows/compatibility-kits.yml'
  push:
    paths:
      - 'compatibility/tck-adapters/**'
      - 'compatibility/**'
      - 'integrations/**'
      - 'src/**'
      - '.github/workflows/compatibility-kits.yml'
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

concurrency:
  group: compatibility-kits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javax-adapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deterministic Jakarta-to-Javax adaptation
        run: compatibility/tck-adapters/test-adapter.sh

  stage-pinned-jaxb-source-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: javax-adapter-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Jakarta XML Binding TCK source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/jakartaee/jaxb-tck.git target/upstream/jaxb-tck
          git -C target/upstream/jaxb-tck checkout d13c23a68a1099668a073514b576f4c504be0e9d
      - name: Stage unofficial Javax compatibility corpus
        run: >-
          compatibility/tck-adapters/jaxb-jakarta-to-javax.sh
          target/upstream/jaxb-tck target/corpora/jaxb-tck-javax
      - name: Publish provenance and exclusion audit
        uses: actions/upload-artifact@v4
        with:
          name: jaxb-javax-corpus-audit
          path: |
            target/corpora/jaxb-tck-javax/SIMDXML-JAVAX-ADAPTATION.txt
            compatibility/tck-adapters/jaxb-javax-exclusions.txt
          retention-days: 30

  provider-and-domain-smoke:
    needs: javax-adapter-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Run Jakarta and Javax provider-neutral kit
        run: |
          JAVA_HOME="$JAVA_HOME" MVN=mvn compatibility/provider-neutral-kits/run-jaxb-ri-neutral.sh
      - name: Run ISO 20022 level-one validation
        run: >-
          mvn -B -ntp -f compatibility/pom.xml
          -Piso20022-validation -pl :simdxml-iso20022-validation -am test
      - name: Run healthcare SOAP and payload validation gate
        run: >-
          mvn -B -ntp -f compatibility/pom.xml
          -Phealthcare-validation -pl :simdxml-healthcare-validation -am test
      - name: Run CXF SOAP compatibility integration
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          mvn -B -ntp -f integrations/pom.xml -Pquarkus-cxf-it
          -pl :simdxml-server-smoke-quarkus -am test
      - name: Run vertical compatibility kit
        run: >-
          mvn -B -ntp -Dtest=VerticalCompatibilityKitTest
          -Dsurefire.parallel=none test
      - name: Run Tomcat Java EE 8 WAR smoke
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          mvn -B -ntp -f integrations/pom.xml
          -pl :simdxml-server-smoke-javaee8 -am verify -Ptomcat-it
      - name: Run Open Liberty Java EE 8 WAR smoke
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          mvn -B -ntp -f integrations/pom.xml
          -pl :simdxml-server-smoke-javaee8 -am verify -Popenliberty-it
      - name: Publish external-kit manifests
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-kit-manifests
          path: |
            compatibility/provider-neutral-kits/jaxb-ri-manifest.tsv
            compatibility/iso20022-validation/validation-plan.tsv
            compatibility/healthcare-validation/capability-manifest.tsv
            compatibility/vertical-kits/verticalization-inventory.tsv
          retention-days: 30
